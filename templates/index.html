<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eLingo Hub</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="home-view" class="view home-view">
        <h1>eLingo Hub</h1>
        <button id="show-join" class="primary-button" type="button">Join Live Session</button>
      </section>

      <section id="join-view" class="view join-view hidden" aria-labelledby="join-heading">
        <h1 id="join-heading">Enter Session Code</h1>
        <form id="join-form" class="join-form">
          <input
            id="session-code-input"
            autocomplete="off"
            inputmode="text"
            maxlength="6"
            pattern="[A-Za-z0-9]{6}"
            aria-label="Session code"
          />
          <button class="primary-button" type="submit">Join</button>
        </form>
        <p id="join-error" class="join-error" role="alert"></p>
      </section>

      <section id="live-view" class="view live-view hidden" aria-labelledby="live-heading">
        <header class="session-header">
          <div>
            <span class="eyebrow">Session</span>
            <h1 id="live-heading">eLingo Hub</h1>
            <p id="session-id" class="session-code">None</p>
          </div>
          <div class="status-grid">
            <div>
              <span>Current status</span>
              <strong id="session-status">Waiting</strong>
            </div>
            <div>
              <span>Connection</span>
              <strong id="connection-status">Connecting</strong>
            </div>
            <div>
              <span>Chunks</span>
              <strong id="chunks-received">0</strong>
            </div>
          </div>
        </header>

        <section class="panel transcript-panel">
          <div class="panel-heading">
            <h2>Live Transcript</h2>
            <span id="recording-state">Not recording</span>
          </div>
          <div id="transcript-log" class="transcript-log"></div>
        </section>

        <section class="panel details-panel">
          <div>
            <span>Upload Status</span>
            <strong id="upload-status">Waiting</strong>
          </div>
          <div>
            <span>Last Chunk</span>
            <strong id="last-chunk">None</strong>
          </div>
          <button id="play-last-chunk" class="secondary-button" type="button" disabled>
            Play Last Chunk
          </button>
        </section>

        <section class="panel logs-panel">
          <h2>System Logs</h2>
          <div id="system-logs" class="log-box"></div>
        </section>
      </section>
    </main>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/dashboard.js?v=3"></script>
  </body>
</html>
